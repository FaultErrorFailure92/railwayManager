[package]
name = "bahnhofsmanager"
version = "0.1.0"
description = "Bahnhofsmanager – Desktop-App (RM-FR-PLAT-02)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
# Steam-Anbindung nur im Steam-Build: cargo tauri build --features steam
steamworks = { version = "0.13", optional = true }

[features]
steam = ["dep:steamworks"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
